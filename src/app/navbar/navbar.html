<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>BMW Navbar</title>

  <style>
    .navbar{
      background-color: black;
      padding: 15px;
    }

    .navbar-brand{
      color: white !important;
      font-size: 28px;
      font-weight: bold;
    }

    .nav-link{
      color: white !important;
      font-size: 18px;
      margin-left: 25px;
    }

    .nav-link:hover{
      color: #00aaff !important;
    }

    .logo{
      width: 50px;
      height: 50px;
      margin-right: 10px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-custom navbar-dark sticky-top">
  <div class="container">
    <!-- Brand Logo / Text -->
    <a class="navbar-brand brand-text" routerLink="">
      <i class="fa-solid fa-bag-shopping me-2"></i>Apex<span>Store</span>
    </a>

    <!-- Hamburger Toggle for Mobile -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navigation Menu Items -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="products" routerLinkActive="active">Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="Items" routerLinkActive="active">Items</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="recipes" routerLinkActive="active">ChefSavour</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="contact" routerLinkActive="active">Contact</a>
        </li>
      </ul>

      <!-- Shopping Cart Button Trigger -->
      <div class="d-flex align-items-center">
        <button class="cart-icon-btn" (click)="toggleCart()" aria-label="Open Cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-badge" *ngIf="cartService.totalItems() > 0">
            {{ cartService.totalItems() }}
          </span>
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- Backdrop Overlay for Cart Drawer -->
<div class="cart-drawer-backdrop" [class.show]="isCartOpen" (click)="toggleCart()"></div>

<!-- Slide-out Shopping Cart Drawer -->
<div class="cart-drawer" [class.show]="isCartOpen">
  <div class="cart-header">
    <h5 class="mb-0 fw-bold"><i class="fa-solid fa-cart-shopping me-2 text-primary"></i>Your Cart</h5>
    <button class="cart-close-btn" (click)="toggleCart()" aria-label="Close Cart">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="cart-body">
    <!-- Empty Cart state -->
    <div *ngIf="cartService.cartItems().length === 0" class="text-center py-5">
      <i class="fa-solid fa-cart-flatbed-suitcases fa-3x text-muted mb-3"></i>
      <h6 class="text-muted fw-semibold">Your cart is empty</h6>
      <p class="small text-secondary mb-4">Add products to your cart to get started.</p>
      <button class="btn btn-primary btn-sm" (click)="toggleCart()" routerLink="products">Shop Now</button>
    </div>

    <!-- Active Cart Items List -->
    <div *ngIf="cartService.cartItems().length > 0">
      <div class="cart-item" *ngFor="let item of cartService.cartItems()">
        <img [src]="item.image" [alt]="item.title" class="cart-item-img">
        <div class="cart-item-info">
          <div class="cart-item-title">{{ item.title }}</div>
          <div class="cart-item-price">{{ item.price | currency }}</div>
          <div class="cart-item-quantity">
            <button class="quantity-btn" (click)="cartService.updateQuantity(item.id, item.quantity - 1)" aria-label="Decrease quantity">-</button>
            <span class="small fw-semibold px-2">{{ item.quantity }}</span>
            <button class="quantity-btn" (click)="cartService.updateQuantity(item.id, item.quantity + 1)" aria-label="Increase quantity">+</button>
          </div>
        </div>
        <button class="cart-item-remove" (click)="cartService.removeFromCart(item.id)" aria-label="Remove item">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Cart Summary and Checkout -->
  <div class="cart-footer" *ngIf="cartService.cartItems().length > 0">
    <div class="cart-total-row">
      <span>Subtotal:</span>
      <span class="text-primary">{{ cartService.subtotal() | currency }}</span>
    </div>
    <button class="btn btn-primary checkout-btn" (click)="toggleCart()">
      Proceed to Checkout
    </button>
  </div>
</div>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
